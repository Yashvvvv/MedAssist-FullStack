# =============================================================================
# MedAssist backend configuration.
# Everything secret or environment specific comes from env vars (see .env.example).
# Profiles: (none) = local dev against a local Postgres, prod = Render + Supabase,
#           demo = seeds a demo pharmacy on startup (safe to leave on: idempotent).
# =============================================================================
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework      # trust X-Forwarded-* from Render's proxy
  error:
    include-message: never

spring:
  application:
    name: medassist-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medassist}
    username: ${DATABASE_USERNAME:medassist}
    password: ${DATABASE_PASSWORD:medassist}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                     # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-null-for-primitives: false     # Jackson 3 default is true; absent booleans mean false
      fail-on-unknown-properties: false      # older app versions may send fields we dropped
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.medassist: INFO
    org.hibernate.SQL: WARN

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  business-zone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    issuer: medassist
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  rate-limit:
    auth-per-minute: 10
    public-per-minute: 60
  billing:
    provider: ${BILLING_PROVIDER:manual}    # manual | razorpay
    trial-days: 14
    razorpay:
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      plan-ids:
        PRO: ${RAZORPAY_PLAN_PRO:}
        BUSINESS: ${RAZORPAY_PLAN_BUSINESS:}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout: 40s
  storage:
    provider: ${STORAGE_PROVIDER:local}     # local | supabase
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${STORAGE_BUCKET:medassist}
  notifications:
    email-from: ${MAIL_FROM:MedAssist <no-reply@medassist.local>}
    dispatch-interval: 30s
  jobs:
    refill-reminder-cron: "0 0 9 * * *"     # 09:00 in business-zone
    expiry-alert-cron: "0 30 8 * * MON"   # weekly digest
  demo:
    enabled: ${DEMO_DATA:false}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
logging:
  level:
    com.medassist: INFO
    root: WARN
