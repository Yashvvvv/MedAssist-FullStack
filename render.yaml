# Render Blueprint: one free Docker web service. The database is Supabase (free
# Postgres that does not expire), so paste its session-pooler JDBC URL below.
# Render free instances sleep after 15 min idle; the first request then takes ~1 min.
services:
  - type: web
    name: medassist-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEMO_DATA
        value: "true"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BILLING_PROVIDER
        value: manual
