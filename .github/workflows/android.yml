name: android

on:
  push:
    paths: ["Medassistandroid/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["Medassistandroid/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Medassistandroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Release build (R8)
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: Medassistandroid/app/build/reports/tests/

  e2e:
    name: End-to-end on an emulator against the real backend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL + backend with demo data
        run: |
          docker network create ma
          docker run -d --name db --network ma -e POSTGRES_DB=medassist -e POSTGRES_USER=medassist -e POSTGRES_PASSWORD=medassist postgres:17-alpine
          docker build -q -t medassist-api backend
          docker run -d --name api --network ma -p 8080:8080 \
            -e DATABASE_URL=jdbc:postgresql://db:5432/medassist -e DATABASE_USERNAME=medassist -e DATABASE_PASSWORD=medassist \
            -e JWT_SECRET=ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz -e DEMO_DATA=true medassist-api
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health/readiness && break; sleep 3; done
          sleep 5
          curl -sf "localhost:8080/api/v1/public/pharmacies/nearby?lat=28.57&lng=77.321&radiusKm=2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: Medassistandroid
          # The debug build talks to http://10.0.2.2:8080 = the backend on this runner.
          # One shell line per step: the runner executes each line separately.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch ../e2e-failed
            # If the emulator dies, adb logcat blocks on "waiting for device" and || true cannot save it.
            timeout 60 adb pull /sdcard/Android/data/com.medassist.app.debug/files/screens ../screens || true
            timeout 60 adb exec-out screencap -p > ../last-screen.png || true
            timeout 60 adb logcat -d > ../logcat.txt || true
            test ! -f ../e2e-failed
      - name: Pull screenshots after a failure
        if: failure()
        run: echo "see artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: |
            screens/
            last-screen.png
            logcat.txt
            Medassistandroid/app/build/reports/androidTests/
