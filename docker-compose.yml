# Local stack: Postgres + backend with the demo pharmacy.
#   docker compose up --build
#   open http://localhost:8080/swagger-ui.html  (login demo@medassist.app / Demo@12345)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medassist
      POSTGRES_USER: medassist
      POSTGRES_PASSWORD: medassist
    # No host port: avoids clashing with a local Postgres; add "5433:5432" to inspect it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist -d medassist"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medassist
      DATABASE_USERNAME: medassist
      DATABASE_PASSWORD: medassist
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-not-for-production-use-0123456789}
      DEMO_DATA: "true"
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
